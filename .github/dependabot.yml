version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      groups:
          php:
              patterns: ['*']
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      groups:
          javascript:
              patterns: ['*']
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
