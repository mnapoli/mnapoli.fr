name: Audit

# Kept separate from CI so that newly published advisories never block deployments.
on:
    pull_request:
    schedule:
        - cron: '0 7 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2

            - run: composer audit --locked
            - run: npm audit
