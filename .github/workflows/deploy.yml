name: Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    checks:
        uses: ./.github/workflows/ci.yml

    deploy:
        needs: checks
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: prod
            url: https://mnapoli.fr
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
                  tools: composer:v2, bref/cli:1.1.14

            - uses: ramsey/composer-install@4.0.0
              with:
                  composer-options: --no-dev --optimize-autoloader
                  require-lock-file: true

            - run: composer check-platform-reqs --no-dev
            - run: npm ci
            - run: npm run build

            # Bref builds the config cache inside Lambda using its runtime environment.
            - name: Deploy to Bref Cloud
              run: bref deploy --env=prod --osls4
              env:
                  BREF_TOKEN: ${{ secrets.BREF_TOKEN }}
