service: blog
frameworkVersion: '4'
configValidationMode: error

bref:
    team: bref

provider:
    name: aws
    stage: prod
    environment:
        APP_ENV: production
        APP_DEBUG: false
        APP_URL: https://mnapoli.fr
        CACHE_STORE: array
        SESSION_DRIVER: cookie
        SESSION_SECURE_COOKIE: true
        QUEUE_CONNECTION: sync
        APP_KEY: 'base64:/EStlF5sExBpWdQ3eB/h+F2zzKGDc5bvDzwe0KD8ZPg='

package:
    patterns:
        - '!.env*'
        - '!.github/**'
        - '!.idea/**'
        - '!.vscode/**'
        - '!**/.DS_Store'
        - '!vendor/_laravel_idea/**'
        - '!tests/**'
        - '!phpunit.xml'
        - '!.phpunit.cache/**'
        - '!bootstrap/cache/config.php'
        - '!bootstrap/cache/routes-*.php'
        - '!drafts/**'
        - '!node_modules/**'
        - '!public/storage'
        - '!resources/css/**'
        - '!resources/js/**'
        - '!storage/**'
        - '!public/favicon.ico'
        - '!public/assets/**'
        - '!public/build/assets/**'
        - '!public/hot'
        - '!public/mix-manifest.json'
        - '!vite.config.js'
        - '!Makefile'
        - '!public/images/**'
        - '!public/presentations/**'

functions:
    web:
        handler: public/index.php
        description: 'mnapoli.fr'
        runtime: php-85-fpm
        timeout: 10
        events:
            - httpApi: '*'
    artisan:
        handler: artisan
        runtime: php-85-console

plugins:
  - ./vendor/bref/bref
  - serverless-lift

constructs:
    website:
        type: server-side-website
        assets:
            '/build/assets/*': public/build/assets
            '/assets/*': public/assets
            '/images/*': public/images
            '/favicon.ico': public/favicon.ico
            '/robots.txt': public/robots.txt
        domain:
            - mnapoli.fr
            - www.mnapoli.fr
        redirectToMainDomain: true
        certificate: arn:aws:acm:us-east-1:416566615250:certificate/05f5f9e1-b896-4725-96e3-6f143d06ac0b
